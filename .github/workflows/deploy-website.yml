name: Deploy Website to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` or `master` branch
  push:
    branches: [ "main", "master" ]
    # CRITICAL: Only trigger if files inside the `website` directory change.
    # This ensures the website deployment NEVER conflicts with or is triggered by the main app's code.
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # All commands in this job will run inside the `website` folder
        working-directory: ./website
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: './website/package-lock.json'

      - name: Install dependencies
        # Uses `npm ci` instead of `npm install` for reproducible, strictly locked, robust builds
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload only the `dist` folder generated by the Astro build
          path: ./website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
